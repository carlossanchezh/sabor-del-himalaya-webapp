<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Chef - Configurar menú diario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Cabecera provisional. Cuando Persona 6 tenga el layout, sustituir por: <div th:replace="~{layout :: header}"></div> -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Sabor del Himalaya · Panel Chef</span>
        <form th:action="@{/auth/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
    </div>
</nav>

<main class="container">
    <div class="card shadow-sm">
        <div class="card-body">

            <!-- P15: cabecera del formulario -->
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h2 class="h4 mb-1">Configuración Menú Diario</h2>
                    <p class="mb-0">Menú diario para el día <strong th:text="${fechaTexto}">fecha</strong></p>
                </div>
                <span class="badge text-bg-danger">NO CONFIGURADO</span>
            </div>

            <!-- Errores de validación que devuelve MenuDiarioService.configurarMenu() -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

            <form th:action="@{/chef/menu}" method="post">
                <input type="hidden" name="fecha" th:value="${menu.fecha}">

                <div class="row g-3">

                    <!-- Entrantes: 3 desplegables (CA13.1 y CA13.4) -->
                    <div class="col-md-4">
                        <div class="p-3 bg-body-tertiary rounded h-100">
                            <h3 class="h6">Entrantes</h3>
                            <select class="form-select mb-2" name="idsEntrantes" required
                                    th:each="i : ${#numbers.sequence(0, 2)}">
                                <option value="" th:text="'Entrante ' + ${i + 1}">Entrante</option>
                                <optgroup label="De la carta">
                                    <option th:each="p : ${entrantesCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsEntrantes != null and menu.idsEntrantes.size() > i and menu.idsEntrantes[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Fuera de carta" th:unless="${#lists.isEmpty(entrantesFueraCarta)}">
                                    <option th:each="p : ${entrantesFueraCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsEntrantes != null and menu.idsEntrantes.size() > i and menu.idsEntrantes[i] == p.idPlato}">Plato</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <!-- Principales: 3 desplegables (CA13.2 y CA13.4) -->
                    <div class="col-md-4">
                        <div class="p-3 bg-body-tertiary rounded h-100">
                            <h3 class="h6">Principales</h3>
                            <select class="form-select mb-2" name="idsPrincipales" required
                                    th:each="i : ${#numbers.sequence(0, 2)}">
                                <option value="" th:text="'Principal ' + ${i + 1}">Principal</option>
                                <optgroup label="De la carta">
                                    <option th:each="p : ${principalesCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPrincipales != null and menu.idsPrincipales.size() > i and menu.idsPrincipales[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Fuera de carta" th:unless="${#lists.isEmpty(principalesFueraCarta)}">
                                    <option th:each="p : ${principalesFueraCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPrincipales != null and menu.idsPrincipales.size() > i and menu.idsPrincipales[i] == p.idPlato}">Plato</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <!-- Postres: 2 desplegables (CA13.3 y CA13.4) -->
                    <div class="col-md-4">
                        <div class="p-3 bg-body-tertiary rounded h-100">
                            <h3 class="h6">Postres</h3>
                            <select class="form-select mb-2" name="idsPostres" required
                                    th:each="i : ${#numbers.sequence(0, 1)}">
                                <option value="" th:text="'Postre ' + ${i + 1}">Postre</option>
                                <optgroup label="De la carta">
                                    <option th:each="p : ${postresCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPostres != null and menu.idsPostres.size() > i and menu.idsPostres[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Fuera de carta" th:unless="${#lists.isEmpty(postresFueraCarta)}">
                                    <option th:each="p : ${postresFueraCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPostres != null and menu.idsPostres.size() > i and menu.idsPostres[i] == p.idPlato}">Plato</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn btn-success w-100 mt-4">GUARDAR MENÚ DEL DÍA Y PUBLICAR</button>
            </form>

            <a th:href="@{/chef/carta}" class="btn btn-link mt-2 px-0">← Volver al panel</a>
        </div>
    </div>
</main>

</body>
</html>
