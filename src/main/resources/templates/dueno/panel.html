<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Dueño - Carta</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- Layout -->
<div th:replace="~{layout :: header}"></div>

<main class="container mt-4">

    <!-- Mensajes de éxito o error -->
    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}">Mensaje</div>
    <div th:if="${errorCarta}" class="alert alert-danger" th:text="${errorCarta}">Error</div>

    <!-- Carta del restaurante -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="h4 mb-0">Carta del restaurante</h2>

                <!-- Botón para abrir el modal de añadir plato -->
                <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalAnadirPlato">
                    Añadir plato
                </button>
            </div>

            <p th:if="${#lists.isEmpty(platos)}" class="text-muted">Todavía no hay platos en la carta.</p>

            <div class="table-responsive" th:unless="${#lists.isEmpty(platos)}">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Categoría</th>
                        <th class="text-end">Precio</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="plato : ${platos}">
                        <td class="fw-semibold" th:text="${plato.nombre}">Nombre</td>
                        <td class="text-muted" th:text="${plato.descripcion}">Descripción</td>
                        <td><span class="badge text-bg-secondary" th:text="${plato.categoria}">CATEGORIA</span></td>
                        <td class="text-end fw-semibold"
                            th:text="${#numbers.formatDecimal(plato.precio, 1, 'POINT', 2, 'COMMA') + ' €'}">0,00 €</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <!-- Botones de editar (US-16) y eliminar (US-18) y la facturación (US-19) se añaden en el Sprint 2 -->
        </div>
    </div>
</main>

<!-- Pop-up con los platos retirados y la opción de crear uno nuevo -->
<div class="modal fade" id="modalAnadirPlato" tabindex="-1" aria-labelledby="tituloAnadirPlato" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title h5" id="tituloAnadirPlato">Añadir plato a la carta</h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body">
                <p th:if="${#lists.isEmpty(platosRetirados)}" class="text-muted mb-0">No hay platos retirados de la carta.</p>

                <ul class="list-group" th:unless="${#lists.isEmpty(platosRetirados)}">
                    <li class="list-group-item d-flex justify-content-between align-items-center gap-3"
                        th:each="retirado : ${platosRetirados}">
                        <div>
                            <div class="fw-semibold" th:text="${retirado.nombre}">Nombre</div>
                            <small class="text-muted"
                                   th:text="${retirado.categoria + ' · ' + #numbers.formatDecimal(retirado.precio, 1, 'POINT', 2, 'COMMA') + ' €'}">CATEGORIA · 0,00 €</small>
                        </div>
                        <form th:action="@{/dueno/platos/{id}/anadir-existente(id=${retirado.idPlato})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-success btn-sm">Añadir</button>
                        </form>
                    </li>
                </ul>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-success w-100" data-bs-toggle="modal" data-bs-target="#modalNuevoPlato">
                    + Crear plato nuevo
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Pop-up para añadir un plato nuevo a la carta -->
<div class="modal fade" id="modalNuevoPlato" tabindex="-1" aria-labelledby="tituloNuevoPlato" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/dueno/platos/nuevo}" th:object="${nuevoPlato}" method="post">
                <div class="modal-header">
                    <h3 class="modal-title h5" id="tituloNuevoPlato">Crear nuevo plato</h3>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <!-- Errores de lógica de negocio que devuelve el servicio -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" maxlength="120" required>

                        <!-- Errores de validación -->
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
                    </div>

                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea id="descripcion" class="form-control" rows="3" th:field="*{descripcion}"
                                  th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'" maxlength="255" required></textarea>
                        <span class="invalid-feedback" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></span>
                    </div>

                    <div class="row g-3">
                        <div class="col-6">
                            <label for="precio" class="form-label">Precio (€)</label>
                            <input type="number" id="precio" class="form-control" th:field="*{precio}"
                                   th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" min="0.01" step="0.01" required>
                            <span class="invalid-feedback" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></span>
                        </div>
                        <div class="col-6">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select id="categoria" class="form-select" th:field="*{categoria}"
                                    th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'" required>
                                <option value="">Selecciona...</option>
                                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}">CATEGORIA</option>
                            </select>
                            <span class="invalid-feedback" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></span>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar plato</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (necesario para componentes interactivos como modales o pestañas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Si el formulario tenía errores, se vuelve a abrir el pop-up al cargar la página -->
<script th:if="${mostrarModal}">
    new bootstrap.Modal(document.getElementById('modalNuevoPlato')).show();
</script>

</body>
</html>
