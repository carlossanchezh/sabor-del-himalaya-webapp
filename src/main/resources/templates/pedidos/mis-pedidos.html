<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- TODO (Persona 6): sustituir por <div th:replace="~{layout :: header}"></div> -->
<nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" th:href="@{/carta}">Sabor del Himalaya</a>
    <div class="d-flex gap-3 align-items-center">
        <a class="link-light" th:href="@{/pedidos/mis-pedidos}">Mis pedidos</a>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
        </form>
    </div>
</nav>

<!-- P10: Seguimiento de los pedidos del usuario (US-08) -->
<main class="container my-4">
    <div class="card">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h2 class="h4 mb-0">Mis pedidos</h2>
                <div class="alert alert-success py-1 px-3 mb-0" th:if="${mensaje}" th:text="${mensaje}"></div>
            </div>

            <div class="text-center text-muted py-5" th:if="${#lists.isEmpty(pedidos)}">
                <p>Todavía no has hecho ningún pedido.</p>
                <a class="btn btn-primary" th:href="@{/carta}">Ver la carta</a>
            </div>

            <!-- CA8.1: un bloque por pedido realizado -->
            <article class="border rounded p-3 mb-3 bg-body-tertiary" th:each="pedido : ${pedidos}">
                <div class="row g-3 align-items-center">
                    <div class="col-md-4">
                        <h3 class="h5 mb-0" th:text="'Pedido #' + ${pedido.idPedido}">Pedido #1024</h3>
                        <div class="small text-muted" th:text="${#temporals.format(pedido.fechaHora, 'dd/MM/yyyy · HH:mm')}">28/09/2026 · 16:42</div>
                        <div class="small text-muted" th:text="${pedido.direccionEntrega}">C/ ejemplo s/n</div>
                        <div class="fs-5 text-success fw-bold"
                             th:text="${#numbers.formatDecimal(pedido.importeTotal, 1, 'POINT', 2, 'COMMA')} + ' €'">33,50 €</div>
                    </div>

                    <!-- CA8.2 y CA8.3: estado actual, el último registrado por el restaurante -->
                    <div class="col-md-8">
                        <span class="badge fs-6 mb-2"
                              th:classappend="${pedido.estado.name() == 'ENTREGADO' ? 'bg-success' : (pedido.estado.name() == 'CANCELADO' ? 'bg-danger' : 'bg-primary')}"
                              th:text="${nombresEstado[pedido.estado]}">Recibido</span>

                        <ol class="list-unstyled d-flex justify-content-between mb-0 small"
                            th:unless="${pedido.estado.name() == 'CANCELADO'}">
                            <li class="text-center flex-fill" th:each="paso : ${pasos}"
                                th:classappend="${pedido.estado.ordinal() >= paso.ordinal()} ? 'text-success fw-bold' : 'text-muted'">
                                <span th:text="${pedido.estado.ordinal() >= paso.ordinal()} ? '●' : '○'">●</span><br>
                                <span th:text="${nombresEstado[paso]}">Recibido</span>
                            </li>
                        </ol>
                    </div>
                </div>
            </article>
        </div>
    </div>
</main>

</body>
</html>
