<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos del día - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Layout -->
<div th:replace="~{layout :: header}"></div>

<!-- Panel de control del staff para gestionar los pedidos del día (US-11 / P13) -->
<main class="container my-4">

    <!-- Mensajes de éxito o error -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" th:text="${mensaje}">Mensaje</div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}">Error</div>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div>
                <h1 class="h4 mb-0">Pedidos del día</h1>
                <small class="text-muted" th:text="${#temporals.format(fecha, 'dd/MM/yyyy')}">00/00/0000</small>
            </div>

            <!-- Botón actualizar: recarga los pedidos del día -->
            <a th:href="@{/staff/pedidos}" class="btn btn-outline-secondary btn-sm">Actualizar</a>
        </div>

        <div class="card-body">

            <!-- Pestañas: Todos + un estado por pestaña -->
            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" role="presentation" th:each="pestana, iter : ${pestanas}">
                    <button class="nav-link" type="button" role="tab" data-bs-toggle="tab"
                            th:classappend="${iter.first} ? 'active' : ''"
                            th:data-bs-target="'#pane-' + ${pestana['id']}">
                        <span th:text="${pestana['etiqueta']}">Estado</span>
                        <span class="badge text-bg-secondary" th:text="${#lists.size(pestana['pedidos'])}">0</span>
                    </button>
                </li>
            </ul>

            <div class="tab-content border border-top-0 rounded-bottom p-3">

                <div class="tab-pane fade" role="tabpanel" th:each="pestana, iter : ${pestanas}"
                     th:classappend="${iter.first} ? 'show active' : ''"
                     th:id="'pane-' + ${pestana['id']}">

                    <!-- Sin pedidos en esta pestaña -->
                    <p th:if="${#lists.isEmpty(pestana['pedidos'])}" class="text-muted text-center py-4 mb-0">
                        No hay pedidos en esta pestaña.
                    </p>

                    <!-- Tabla de pedidos -->
                    <div class="table-responsive" th:unless="${#lists.isEmpty(pestana['pedidos'])}">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th>Pedido</th>
                                <th>Hora</th>
                                <th>Dirección</th>
                                <th class="text-end">Importe</th>
                                <th>Estado</th>
                                <th class="text-end">Cambiar estado</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="pedido : ${pestana['pedidos']}">
                                <td class="fw-semibold" th:text="'#' + ${pedido.idPedido}">#0</td>
                                <td th:text="${#temporals.format(pedido.fechaHora, 'HH:mm')}">00:00</td>
                                <td th:text="${pedido.direccionEntrega}">C/ ejemplo s/n</td>
                                <td class="text-end fw-semibold"
                                    th:text="${#numbers.formatDecimal(pedido.importeTotal, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</td>

                                <!-- Badge del estado actual -->
                                <td>
                                    <span class="badge"
                                          th:classappend="${pedido.estado.name() == 'ENTREGADO' ? 'text-bg-success' : (pedido.estado.name() == 'CANCELADO' ? 'text-bg-danger' : (pedido.estado.name() == 'RECIBIDO' ? 'text-bg-secondary' : 'text-bg-primary'))}"
                                          th:text="${nombresEstado[pedido.estado]}">Recibido</span>
                                </td>

                                <!-- Desplegable para cambiar el estado (CambioEstadoDTO: idPedido + nuevoEstado) -->
                                <td>
                                    <form th:action="@{/staff/pedidos/estado}" method="post"
                                          class="d-flex justify-content-end align-items-center gap-2 m-0">
                                        <input type="hidden" name="idPedido" th:value="${pedido.idPedido}">
                                        <select name="nuevoEstado" class="form-select form-select-sm" style="width: auto;">
                                            <option th:each="e : ${estados}" th:value="${e}"
                                                    th:text="${nombresEstado[e]}"
                                                    th:selected="${e == pedido.estado}">Estado</option>
                                        </select>
                                        <button type="submit" class="btn btn-primary btn-sm">Actualizar</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS Bundle (necesario para las pestañas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
