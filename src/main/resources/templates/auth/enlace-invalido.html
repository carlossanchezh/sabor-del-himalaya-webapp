<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enlace Inválido - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icono central -->
    <style>
        .icono-error {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 5px solid #dc3545;
            color: #dc3545;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
        }
    </style>

</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow border-0">
                <div class="card-body text-center p-5">
                    <div class="icono-error">✗</div>
                    <h2 class="fw-bold mb-3" style="color: #dc3545;">Enlace no válido</h2>
                    <p class="text-muted">El enlace de activación no es válido o ya se ha utilizado.</p>

                    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

                    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>

                    <!-- Formulario para reenviar -->
                    <form th:action="@{/auth/reenviar}" method="post" class="mt-4">
                        <p class="text-muted mb-2 text-start">Introduce tu login o correo a continuación para enviarte un nuevo enlace</p>
                        <div class="input-group">
                            <input type="text" name="logincorreo" class="form-control" required>
                            <button type="submit" class="btn btn-secondary">REENVIAR CORREO</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
