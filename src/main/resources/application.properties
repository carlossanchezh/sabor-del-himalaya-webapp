spring.application.name=sabor-himalaya

server.port=${APP_PORT:8080}
app.host=${APP_HOST:localhost}
app.scheme=${APP_SCHEME:http}

# ------------------------------------------------------------
# URL BASE DE LA APP
# ------------------------------------------------------------

app.base-url=${APP_BASE_URL:${app.scheme}://${app.host}:${server.port}}

# ---------------------------
# JPA / Hibernate
# ---------------------------

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true

# ---------------------------
# DataSource (MySQL)
# ---------------------------

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/sabor_himalaya?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------
# THYMELEAF
# ---------------------------

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ------------------------------------------------------------
# ENVÍO DE CORREO
# ------------------------------------------------------------

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ------------------------------------------------------------
# LOGGING EN FICHERO
# ------------------------------------------------------------

# Ruta y nombre del fichero de log
logging.file.name=${LOG_FILE:logs/sabor-del-himalaya.log}

# Tamaño máximo por fichero antes de rotar
logging.logback.rollingpolicy.max-file-size=10MB

# Número máximo de ficheros históricos a conservar
logging.logback.rollingpolicy.max-history=7

# Tamaño total máximo de todos los ficheros de log
logging.logback.rollingpolicy.total-size-cap=100MB

# Patrón de las líneas
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

