<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar pedido - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- Layout -->
<div th:replace="~{layout :: header}"></div>

<!-- Editar productos del pedido antes de confirmarlo -->
<main class="container my-4">

    <!-- Mensajes de error -->
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4">

        <!-- Lista editable de productos -->
        <section class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h4">Editar productos del pedido</h1>
                    <p class="text-muted small">Pedido aún no enviado. Cambia la cantidad de los productos o elimínalos del pedido.</p>

                    <form th:action="@{/pedidos/editar-pedido-temporal}" method="post">

                        <h3 class="h5 mb-2">Productos del pedido:</h3>

                        <!-- Iteramos sobre las líneas del resumen -->
                        <div class="d-flex align-items-center gap-2 border-bottom py-2"
                             th:each="linea : ${resumenPedidoTemporal.lineas}">

                            <!-- Nombre y detalle del producto -->
                            <div class="flex-grow-1">
                                <span th:text="${linea.nombre}">Nombre del producto</span>
                                <div class="small text-muted" th:if="${linea.detalle}" th:text="${linea.detalle}"></div>
                            </div>

                            <!-- Input para cambiar la cantidad -->
                            <input type="number" class="form-control form-control-sm cantidad" style="width: 5rem"
                                   min="0" max="99" required th:aria-label="'Cantidad de ' + ${linea.nombre}"
                                   th:name="${linea.menu} ? 'cantidadesMenu' : 'cantidadesPlato'"
                                   th:value="${linea.cantidad}"
                                   th:attr="data-precio=${linea.precioUnitario}">

                            <!-- Subtotal actualizado -->
                            <span class="text-end subtotal" style="width: 5.5rem"
                                  th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>

                            <!-- Botón de eliminar (La X) -->
                            <button type="submit" class="btn btn-sm btn-danger" formnovalidate
                                    th:name="${linea.menu} ? 'eliminarMenu' : 'eliminarPlato'"
                                    th:value="${linea.indice}" th:aria-label="'Quitar ' + ${linea.nombre}">✕</button>
                        </div>

                        <!-- Botones de navegación y guardado -->
                        <div class="d-flex gap-2 mt-4">
                            <a class="btn btn-secondary flex-fill" th:href="@{/pedidos/revisar}">Descartar cambios</a>
                            <button type="submit" class="btn btn-success flex-fill">Guardar y volver</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Panel de resumen -->
        <aside class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h4">Resumen del pedido</h2>

                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Importe anterior</span>
                        <span id="importe-anterior" th:attr="data-importe=${resumenPedidoTemporal.total}"
                              th:text="${#numbers.formatDecimal(resumenPedidoTemporal.total, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span class="text-muted">Diferencia</span>
                        <span id="diferencia">0,00 €</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="fw-bold">Importe total</span>
                        <span class="fs-4 text-success" id="total"
                              th:text="${#numbers.formatDecimal(resumenPedidoTemporal.total, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>
                    </div>
                </div>
            </div>
        </aside>
    </div>
</main>

<!-- Bootstrap JS Bundle (necesario para componentes interactivos como modales o pestañas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Cálculo del nuevo importe al cambiar las cantidades (el servidor lo recalcula al guardar) -->
<script>
    document.addEventListener('DOMContentLoaded', function () {

        function euros(valor) {
            return valor.toFixed(2).replace('.', ',') + ' €';
        }

        var anterior = parseFloat(document.getElementById('importe-anterior').dataset.importe);
        var inputs = document.querySelectorAll('.cantidad');

        function recalcular() {
            var total = 0;
            inputs.forEach(function (input) {
                var cantidad = Math.max(0, parseInt(input.value, 10) || 0);
                var subtotal = cantidad * parseFloat(input.dataset.precio);
                input.parentElement.querySelector('.subtotal').textContent = euros(subtotal);
                total += subtotal;
            });
            var diferencia = total - anterior;
            document.getElementById('total').textContent = euros(total);
            document.getElementById('diferencia').textContent = (diferencia > 0 ? '+' : '') + euros(diferencia);
        }

        inputs.forEach(function (input) {
            input.addEventListener('input', recalcular);
        });
        recalcular();
    });
</script>
</body>
</html>
