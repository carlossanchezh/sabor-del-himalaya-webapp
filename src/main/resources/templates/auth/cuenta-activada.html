<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuenta Activada - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icono central -->
    <style>
        .icono-check {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 5px solid #198754;
            color: #198754;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
        }
    </style>

</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow border-0">
                <div class="card-body text-center p-5">
                    <div class="icono-check">✓</div>
                    <h2 class="fw-bold mb-3" style="color: #198754;">¡Cuenta activada!</h2>
                    <p class="text-muted">Tu cuenta se ha activado correctamente.</p>
                    <div class="mt-4">
                        <a th:href="@{/auth/login}" class="btn btn-primary w-100">INICIAR SESIÓN</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (necesario para componentes interactivos como modales o pestañas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
