<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo} ?: 'Sabor del Himalaya'">Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

    <!-- CABECERA REUTILIZABLE (Fragmento) -->
    <header th:fragment="header" class="navbar navbar-dark bg-dark px-4 py-3 shadow-sm">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold fs-4 text-white" th:href="@{/}">Sabor del Himalaya</a>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Información del usuario logueado -->
                <span class="text-white" sec:authorize="isAuthenticated()">
                    Hola, <span sec:authentication="name">Usuario</span>!
                </span>
                
                <!-- Botón de Logout -->
                <form th:action="@{/auth/logout}" method="post" class="m-0" sec:authorize="isAuthenticated()">
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
                </form>
                
                <!-- Acceso alternativo si no está autenticado -->
                <a th:href="@{/auth/login}" class="btn btn-outline-light btn-sm" sec:authorize="!isAuthenticated()">Iniciar Sesión</a>
            </div>
        </div>
    </header>

    <!-- Bootstrap JS Bundle (necesario para componentes interactivos como modales o pestañas) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
