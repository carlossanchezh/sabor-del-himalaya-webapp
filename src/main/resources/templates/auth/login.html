<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">

        <!-- COLUMNA IZQUIERDA: LOGIN -->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Iniciar Sesión</h2>

                    <!-- Formulario de Login -->
                    <form th:action="@{/auth/login}" method="post">
                        <!-- Login -->
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" name="login" class="form-control" required />
                        </div>
                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="contrasena" class="form-control" required />
                        </div>
                        <button type="submit" class="btn btn-primary w-100">INICIAR SESIÓN</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- COLUMNA DERECHA: REGISTRO -->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Crear Cuenta</h2>

                    <!-- Formulario de Registro -->
                    <form th:action="@{/auth/registro}" th:object="${registroUsuarioDTO}" method="post">

                        <!-- Mensaje de error global (fallo inesperado) -->
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                        </div>

                        <!-- Nombre -->
                        <div class="mb-3">
                            <label class="form-label">Nombre completo</label>
                            <input type="text" th:field="*{nombre}" class="form-control" required />
                            <!-- error en el nombre -->
                            <span th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-danger small"></span>
                        </div>
                        <!-- Dirección -->
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" th:field="*{direccion}" class="form-control" required />
                            <!-- error en la dirección -->
                            <span th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}" class="text-danger small"></span>
                        </div>
                        <!-- Correo -->
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" th:field="*{correo}" class="form-control" required />
                            <!-- error el correo ya existe -->
                            <span th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}" class="text-danger small"></span>
                        </div>
                        <!-- Login -->
                        <div class="mb-3">
                            <label class="form-label">Nombre de Usuario (Login)</label>
                            <input type="text" th:field="*{login}" class="form-control" required />
                            <!-- error login ya existe -->
                            <span th:if="${#fields.hasErrors('login')}" th:errors="*{login}" class="text-danger small"></span>
                        </div>
                        <!-- Contraseña -->
                        <div class="mb-4">
                            <label class="form-label">Contraseña</label>
                            <input type="password" th:field="*{contrasena}" class="form-control" required />
                            <!-- error en la contraseña -->
                            <span th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}" class="text-danger small"></span>
                        </div>
                        <button type="submit" class="btn btn-success w-100">CREAR CUENTA</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
