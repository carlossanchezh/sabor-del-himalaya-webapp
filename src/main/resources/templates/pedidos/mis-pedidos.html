<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis pedidos - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos personalizados para la barra de progreso -->
    <style>
        .stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .stepper::before {
            content: '';
            position: absolute;
            top: 40px;
            left: 12.5%;
            right: 12.5%;
            height: 4px;
            background-color: #dee2e6;
            z-index: 1;
        }

        .step-item {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }

        .step-label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            height: 20px;
        }

        .step-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid #dee2e6;
            background-color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin: 0 auto;
        }

        .step-circle.completed {
            border-color: #198754;
            background-color: #198754;
            color: white;
            font-size: 16px;
            font-weight: bold;
        }
    </style>

</head>
<body class="bg-light">

<!-- Layout -->
<div th:replace="~{layout :: header}"></div>

<!-- Seguimiento de los pedidos del usuario -->
<main class="container my-4 mt-4">
    <div class="card">
        <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                <h2 class="h4 mb-0">Mis pedidos</h2>

                <div class="d-flex align-items-center gap-3">
                    <!-- Mensaje de éxito tras confirmar un pedido -->
                    <div class="alert alert-success py-1 px-3 mb-0" th:if="${mensaje}" th:text="${mensaje}"></div>

                    <!-- Botón para volver a la carta -->
                    <a th:href="@{/carta}" class="btn btn-primary">Volver a la carta</a>
                </div>

            </div>

            <!-- Estado vacío: El usuario no ha realizado pedidos todavía -->
            <div class="text-center text-muted py-5" th:if="${#lists.isEmpty(pedidos)}">
                <p>Todavía no has hecho ningún pedido.</p>
            </div>

            <!-- Un bloque por pedido realizado -->
            <article class="border rounded p-3 mb-3 bg-body-tertiary" th:each="pedido : ${pedidos}">
                <div class="row g-3 align-items-center">

                    <!-- Información básica del pedido -->
                    <div class="col-md-4">
                        <h3 class="h5 mb-0" th:text="'Pedido #' + ${pedido.idPedido}">Pedido #0</h3>
                        <div class="small text-muted" th:text="${#temporals.format(pedido.fechaHora, 'dd/MM/yyyy · HH:mm')}">00/00/0000 · 00:00</div>
                        <div class="small text-muted" th:text="${pedido.direccionEntrega}">C/ ejemplo s/n</div>
                        <div class="fs-5 text-success fw-bold"
                             th:text="${#numbers.formatDecimal(pedido.importeTotal, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</div>
                    </div>

                    <!-- Estado actual y barra de progreso -->
                    <div class="col-md-8">

                        <!-- Badge del estado actual -->
                        <span class="badge fs-6 mb-4"
                              th:classappend="${pedido.estado.name() == 'ENTREGADO' ? 'bg-success' : (pedido.estado.name() == 'CANCELADO' ? 'bg-danger' : 'bg-primary')}"
                              th:text="${nombresEstado[pedido.estado]}">Recibido</span>

                        <!-- Barra de progreso (oculta si está cancelado) -->
                        <ul class="stepper" th:unless="${pedido.estado.name() == 'CANCELADO'}">
                            <li class="step-item" th:each="paso : ${pasos}">

                                <!-- Texto de la fase: Azul por defecto, Verde si ya se ha llegado -->
                                <span class="step-label"
                                      th:text="${nombresEstado[paso]}"
                                      th:classappend="${pedido.estado.ordinal() >= paso.ordinal()} ? 'text-success fw-bold' : 'text-primary'">Estado</span>

                                <!-- Círculo de la fase -->
                                <div class="step-circle"
                                     th:classappend="${pedido.estado.ordinal() >= paso.ordinal()} ? 'completed' : ''"
                                     th:text="${pedido.estado.ordinal() >= paso.ordinal()} ? '✓' : ''">
                                </div>

                            </li>
                        </ul>
                    </div>

                    <!-- Información de los productos del pedido -->
                    <div class="mt-3 pt-3 border-top">
                        <h4 class="h6 text-muted mb-2">Productos del pedido:</h4>
                        <ul class="list-unstyled small mb-0">

                            <!-- Iteramos sobre el resumen del pedido actual usando su ID -->
                            <li th:each="linea : ${resumenesPedidos[pedido.idPedido].lineas}" class="mb-2">

                                <!-- Cantidad del producto -->
                                <span class="badge text-bg-light border me-2 fw-normal" th:text="${linea.cantidad} + 'x'">1x</span>

                                <!-- Nombre del producto -->
                                <span th:text="${linea.nombre}">Plato</span>

                                <!-- Detalle del menú si aplica -->
                                <span class="text-muted ms-1" th:if="${linea.detalle}" th:text="'(' + ${linea.detalle} + ')'"></span>

                                <!-- Subtotal alineado a la derecha -->
                                <span class="float-end text-muted" th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>
                            </li>
                        </ul>
                    </div>

                </div>
            </article>
        </div>
    </div>
</main>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
