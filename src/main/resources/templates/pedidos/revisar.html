<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisar pedido - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- Layout -->
<div th:replace="~{layout :: header}"></div>

<!-- Revisar y confirmar pedido -->
<main class="container my-4 mt-4">

    <!-- Mensajes de error -->
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4">

        <!-- Tabla con el resumen de productos y totales -->
        <section class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h4">Revisar y confirmar pedido</h2>
                    <p class="text-muted small">Comprueba los productos y el importe antes de enviarlo</p>

                    <!-- Productos seleccionados e importe total -->
                    <table class="table align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Producto</th>
                            <th class="text-center" style="width: 80px;">Cant.</th>
                            <th class="text-end" style="width: 100px;">Precio</th>
                            <th class="text-end" style="width: 100px;">Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>

                        <!-- Iteramos sobre las líneas del ResumenPedidoDTO -->
                        <tr th:each="linea : ${resumenPedidoTemporal.lineas}">
                            <td>
                                <span class="fw-semibold" th:text="${linea.nombre}">Nombre del producto</span>
                                <div class="small text-muted" th:if="${linea.detalle}" th:text="${linea.detalle}"></div>
                            </td>
                            <td class="text-center" th:text="${linea.cantidad}">0</td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(linea.precioUnitario, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <th colspan="3">Total del pedido</th>
                            <th class="text-end text-success"
                                th:text="${#numbers.formatDecimal(resumenPedidoTemporal.total, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</th>
                        </tr>
                        </tfoot>
                    </table>

                    <!-- Botones de navegación -->
                    <div class="d-flex gap-2">
                        <a class="btn btn-secondary flex-fill" th:href="@{/carta}">Seguir añadiendo</a>
                        <a class="btn btn-warning flex-fill" th:href="@{/pedidos/editar-pedido-temporal}">Editar productos</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Formulario de dirección y confirmación -->
        <aside class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h4">Entrega</h2>

                    <form th:action="@{/pedidos/confirmar}" method="post">

                        <!-- Nombre del cliente -->
                        <p class="fw-bold mb-1" th:text="${nombreUsuario}">Nombre del cliente</p>
                        <!-- Dirección de entrega -->
                        <label for="direccionEntrega" class="form-label small">Dirección de entrega</label>
                        <!-- th:text rellena el textarea con la dirección del perfil o la que escribió el usuario -->
                        <textarea id="direccionEntrega" name="direccionEntrega" class="form-control mb-3" rows="2"
                                  required maxlength="255" th:text="${direccionEntrega}"></textarea>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fw-bold">Total a pagar</span>
                            <span class="fs-4 text-success"
                                  th:text="${#numbers.formatDecimal(resumenPedidoTemporal.total, 1, 'POINT', 2, 'COMMA')} + ' €'">0,00 €</span>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Confirmar pedido</button>
                    </form>
                </div>
            </div>
        </aside>
    </div>
</main>

<!-- Bootstrap JS Bundle (necesario para componentes interactivos como modales o pestañas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
