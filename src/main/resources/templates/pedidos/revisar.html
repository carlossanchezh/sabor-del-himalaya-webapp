<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Revisar pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- TODO (Persona 6): sustituir por <div th:replace="~{layout :: header}"></div> -->
<nav class="navbar navbar-dark bg-primary px-3">
    <a class="navbar-brand" th:href="@{/carta}">Sabor del Himalaya</a>
    <div class="d-flex gap-3 align-items-center">
        <a class="link-light" th:href="@{/pedidos/mis-pedidos}">Mis pedidos</a>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
        </form>
    </div>
</nav>

<!-- P8: Revisar y confirmar pedido (US-07) -->
<main class="container my-4">
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

    <div class="row g-4">
        <!-- CA7.1 y CA7.2: productos seleccionados e importe total -->
        <section class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="h4">Revisar y confirmar pedido</h2>
                    <p class="text-muted small">Comprueba los productos y el importe antes de enviarlo</p>

                    <table class="table align-middle">
                        <thead>
                        <tr>
                            <th>Producto</th>
                            <th class="text-center">Cant.</th>
                            <th class="text-end">Precio</th>
                            <th class="text-end">Subtotal</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="linea : ${resumenCarrito.lineas}">
                            <td>
                                <span th:text="${linea.nombre}">Croquetas caseras</span>
                                <div class="small text-muted" th:if="${linea.detalle}" th:text="${linea.detalle}"></div>
                            </td>
                            <td class="text-center" th:text="${linea.cantidad}">2</td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(linea.precioUnitario, 1, 'POINT', 2, 'COMMA')} + ' €'">8,00 €</td>
                            <td class="text-end" th:text="${#numbers.formatDecimal(linea.subtotal, 1, 'POINT', 2, 'COMMA')} + ' €'">16,00 €</td>
                        </tr>
                        </tbody>
                        <tfoot>
                        <tr>
                            <th colspan="3">Total del pedido</th>
                            <th class="text-end text-success"
                                th:text="${#numbers.formatDecimal(resumenCarrito.total, 1, 'POINT', 2, 'COMMA')} + ' €'">33,50 €</th>
                        </tr>
                        </tfoot>
                    </table>

                    <div class="d-flex gap-2">
                        <a class="btn btn-secondary flex-fill" th:href="@{/carta}">Seguir añadiendo</a>
                        <a class="btn btn-warning flex-fill" th:href="@{/pedidos/editar-carrito}">Editar productos</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- CA7.3: dirección de entrega y confirmación -->
        <aside class="col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h2 class="h4">Entrega</h2>
                    <form th:action="@{/pedidos/confirmar}" method="post">
                        <p class="fw-bold mb-1" th:text="${usuario.nombre}">Nombre del cliente</p>
                        <label for="direccionEntrega" class="form-label small">Dirección de entrega</label>
                        <textarea id="direccionEntrega" name="direccionEntrega" class="form-control mb-3" rows="2"
                                  required maxlength="255" th:text="${direccionEntrega}"></textarea>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fw-bold">Total</span>
                            <span class="fs-4 text-success"
                                  th:text="${#numbers.formatDecimal(resumenCarrito.total, 1, 'POINT', 2, 'COMMA')} + ' €'">33,50 €</span>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Confirmar pedido</button>
                    </form>
                </div>
            </div>
        </aside>
    </div>
</main>

</body>
</html>
