<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Chef - Nuevo plato fuera de carta</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- Layout -->
<div th:replace="~{layout :: header}"></div>

<main class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body">

                    <!-- Cabecera del formulario -->
                    <h2 class="h4 mb-1">Nuevo plato fuera de carta</h2>
                    <p class="text-muted mb-3">
                        El plato no aparecerá en la carta: queda guardado para elegirlo en los menús diarios.
                    </p>

                    <!-- Errores de validación -->
                    <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

                    <form th:action="@{/chef/platos/nuevo}" th:object="${plato}" method="post">

                        <!-- Nombre -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" th:field="*{nombre}"
                                   maxlength="120" required placeholder="Ej.: Crema de calabaza">
                        </div>

                        <!-- Descripción -->
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" th:field="*{descripcion}" rows="3"
                                      maxlength="255" required placeholder="Ingredientes o elaboración"></textarea>
                        </div>

                        <!-- Categoría: solo las del menú diario -->
                        <div class="mb-4">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select class="form-select" th:field="*{categoria}" required>
                                <option value="">-- Elige una categoría --</option>
                                <option th:each="c : ${categorias}" th:value="${c}"
                                        th:text="${#strings.capitalize(#strings.toLowerCase(c.name()))}">Entrante</option>
                            </select>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/chef/carta}" class="btn btn-outline-secondary px-4">Cancelar</a>
                            <button type="submit" class="btn btn-success flex-grow-1">Guardar plato</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
