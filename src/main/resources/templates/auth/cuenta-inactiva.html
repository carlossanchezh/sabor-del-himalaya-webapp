<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cuenta Inactiva - Sabor del Himalaya</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icono central -->
    <style>
        .icono-aviso {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 5px solid #ffc107;
            color: #ffc107;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px auto;
        }
    </style>

</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card shadow border-0">
                <div class="card-body text-center p-5">

                    <div class="icono-aviso">!</div>
                    <h2 class="fw-bold mb-3" style="color: #ffc107;">Cuenta no activada</h2>

                    <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

                    <div th:if="${mensajeExito}" class="alert alert-success" th:text="${mensajeExito}"></div>

                    <p class="text-muted">Esta cuenta está registrada, pero todavía no ha sido activada.</p>

                    <p class="text-muted mb-0 mt-3">Revisa tu correo electrónico. Si no recibiste el enlace de activación, pulsa "Reenviar correo".</p>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mt-4">

                        <!-- Botón de reenviar -->
                        <form th:action="@{/auth/reenviar}" method="post" class="m-0 flex-fill">
                            <input type="hidden" name="logincorreo" th:value="${login}">
                            <button type="submit" class="btn btn-secondary w-100">REENVIAR CORREO</button>
                        </form>

                        <!-- Botón para ir al login -->
                        <a th:href="@{/auth/login}" class="btn btn-primary flex-fill">INICIAR SESIÓN</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (necesario para componentes interactivos como modales o pestañas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
