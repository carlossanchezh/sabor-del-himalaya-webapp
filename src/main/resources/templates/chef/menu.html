<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Chef - Configurar menú diario</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<!-- Layout -->
<div th:replace="~{layout :: header}"></div>

<main class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-body">

            <!-- Cabecera del formulario -->
            <div class="d-flex justify-content-between align-items-start mb-3">
                <div>
                    <h2 class="h4 mb-1">Configuración Menú Diario</h2>
                    <p class="mb-0">Menú diario para el día <strong th:text="${fechaTexto}">fecha</strong></p>
                </div>
                <span class="badge text-bg-danger">NO CONFIGURADO</span>
            </div>

            <!-- Errores de validación -->
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

            <form th:action="@{/chef/menu}" method="post">
                <input type="hidden" name="fecha" th:value="${menu.fecha}">

                <div class="row g-3">

                    <!-- Entrantes: 3 desplegables -->
                    <div class="col-md-4">
                        <div class="p-3 bg-body-tertiary rounded h-100">
                            <h3 class="h6">Entrantes</h3>
                            <select class="form-select mb-2" name="idsEntrantes" required
                                    th:each="i : ${#numbers.sequence(0, 2)}">
                                <option value="" th:text="'Entrante ' + ${i + 1}">Entrante</option>
                                <optgroup label="De Carta">
                                    <option th:each="p : ${entrantesCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsEntrantes != null and menu.idsEntrantes.size() > i and menu.idsEntrantes[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Del Chef" th:unless="${#lists.isEmpty(entrantesChef)}">
                                    <option th:each="p : ${entrantesChef}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsEntrantes != null and menu.idsEntrantes.size() > i and menu.idsEntrantes[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Fuera de Carta" th:unless="${#lists.isEmpty(entrantesRetirados)}">
                                    <option th:each="p : ${entrantesRetirados}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsEntrantes != null and menu.idsEntrantes.size() > i and menu.idsEntrantes[i] == p.idPlato}">Plato</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <!-- Principales: 3 desplegables -->
                    <div class="col-md-4">
                        <div class="p-3 bg-body-tertiary rounded h-100">
                            <h3 class="h6">Principales</h3>
                            <select class="form-select mb-2" name="idsPrincipales" required
                                    th:each="i : ${#numbers.sequence(0, 2)}">
                                <option value="" th:text="'Principal ' + ${i + 1}">Principal</option>
                                <optgroup label="De Carta">
                                    <option th:each="p : ${principalesCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPrincipales != null and menu.idsPrincipales.size() > i and menu.idsPrincipales[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Del Chef" th:unless="${#lists.isEmpty(principalesChef)}">
                                    <option th:each="p : ${principalesChef}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPrincipales != null and menu.idsPrincipales.size() > i and menu.idsPrincipales[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Fuera de Carta" th:unless="${#lists.isEmpty(principalesRetirados)}">
                                    <option th:each="p : ${principalesRetirados}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPrincipales != null and menu.idsPrincipales.size() > i and menu.idsPrincipales[i] == p.idPlato}">Plato</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                    <!-- Postres: 2 desplegables -->
                    <div class="col-md-4">
                        <div class="p-3 bg-body-tertiary rounded h-100">
                            <h3 class="h6">Postres</h3>
                            <select class="form-select mb-2" name="idsPostres" required
                                    th:each="i : ${#numbers.sequence(0, 1)}">
                                <option value="" th:text="'Postre ' + ${i + 1}">Postre</option>
                                <optgroup label="De Carta">
                                    <option th:each="p : ${postresCarta}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPostres != null and menu.idsPostres.size() > i and menu.idsPostres[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Del Chef" th:unless="${#lists.isEmpty(postresChef)}">
                                    <option th:each="p : ${postresChef}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPostres != null and menu.idsPostres.size() > i and menu.idsPostres[i] == p.idPlato}">Plato</option>
                                </optgroup>
                                <optgroup label="Fuera de Carta" th:unless="${#lists.isEmpty(postresRetirados)}">
                                    <option th:each="p : ${postresRetirados}" th:value="${p.idPlato}" th:text="${p.nombre}"
                                            th:selected="${menu.idsPostres != null and menu.idsPostres.size() > i and menu.idsPostres[i] == p.idPlato}">Plato</option>
                                </optgroup>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="d-flex justify-content-between align-items-center gap-3 mt-4">
                    <!-- Botón Volver -->
                    <a th:href="@{/chef/carta}" class="btn btn-outline-secondary px-4">
                        Volver
                    </a>

                    <!-- Botón Guardar -->
                    <button type="submit" class="btn btn-success flex-grow-1">
                        Publicar menú del día
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Bootstrap JS Bundle (necesario para componentes interactivos como modales o pestañas) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
